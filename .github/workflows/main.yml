name: soma-people-action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

env:
  APPLICATION_NAME: soma-people-back
  S3_BUCKET_NAME: soma-people-build
  AWS_REGION: ap-northeast-2
  CODEDEPLOY_NAME: soma-people-codedeploy
  CODEDEPLOY_GROUP: soma-people-codedeploy-group

jobs:
  build:
    runs-on: ubuntu-18.04
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Java JDK
        uses: actions/setup-java@v3.10.0
        with:
          java-version: '11'
          distribution: 'corretto'
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean build
      
      - name: Make zip file
        run: |
          mkdir -p before-deploy                                             # zip에 포함시킬 파일들을 담을 디렉토리 생성
          cp scripts/*.sh before-deploy/
          cp appspec.yml before-deploy/
          cp build/libs/*.jar before-deploy/
          cd before-deploy && zip -r before-deploy *                         # before-deploy로 이동 후 전체 압축
          cd ../ && mkdir -p deploy                                          # 상위 디렉토리로 이동 후 deploy 디렉토리 생성
          mv before-deploy/before-deploy.zip deploy/$APPLICATION_NAME.zip    # deploy로 zip파일 이동
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Upload to S3
        run: aws s3 cp --region ap-northeast-2 ./deploy/$APPLICATION_NAME.zip s3://$S3_BUCKET_NAME/$GITHUB_SHA.zip
      
      - name: Code Deploy
        run: aws deploy create-deployment
          --application-name $CODEDEPLOY_NAME
          --deployment-config-name CodeDeployDefault.AllAtOnce
          --deployment-group-name $CODEDEPLOY_GROUP
          --s3-location bucket=$S3_BUCKET_NAME,bundleType=zip,key=$GITHUB_SHA.zip
